name: Release

on:
  push:
    branches:
      - master

jobs:
  release:
    if: github.repository == 'tonightpass/tonightpass'

    runs-on: ubuntu-latest

    env:
      # changesets commits the version bump, which fires the pre-commit hook,
      # which runs the whole test suite again inside the job. A single red test
      # then blocks the commit and no release PR is ever opened, which is why
      # nothing reached npm after 2026-07-07. The workflow already runs lint,
      # build and tests as its own steps, so the hook adds nothing here.
      HUSKY: 0

    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Extract pnpm version
        id: extract_pnpm_version
        run: echo "::set-output name=pnpm_version::$(jq -r '.packageManager' package.json | cut -d'@' -f2)"

      - name: Use pnpm
        uses: pnpm/action-setup@v4.1.0
        with:
          version: ${{ steps.extract_pnpm_version.outputs.pnpm_version }}

      - name: Use Node
        uses: actions/setup-node@v4
        with:
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      # npm 11 is required for OIDC trusted publishing, and npm 12 must be
      # avoided: it rejects unknown cli flags with EUNKNOWNCONFIG, and pnpm
      # forwards its own --git-checks flag when it hands the publish over to
      # npm. The last successful release ran on 2026-07-07, npm 12.0.0 shipped
      # on 2026-07-08, and nothing has been published since. Pin the major.
      - name: Update npm (for OIDC support)
        run: sudo npm install -g "npm@^11"

      - name: Install Dependencies
        run: pnpm i --no-frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Create Release Pull Request or Publish to npm
        uses: changesets/action@v1
        with:
          publish: pnpm run release
          version: pnpm run version
          commit: "🔖 release version"
          title: "🔖 release version"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ""
